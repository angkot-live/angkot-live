name: Checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Local demo helper unit tests
        working-directory: .
        run: node --test scripts/*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser flow integration
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:9001
          VITE_SUPABASE_ANON_KEY: test-anon
        run: |
          npm run dev -- --host 127.0.0.1 --strictPort > /tmp/angkot-vite.log 2>&1 &
          angkot_vite_pid=$!
          trap 'kill "$angkot_vite_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:landing
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum
      - run: go -C apps/api vet ./...
      - run: go -C apps/api test -race ./...
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: cat apps/api/tests/bootstrap.sql supabase/migrations/*.sql apps/api/tests/flows.sql | psql -v ON_ERROR_STOP=1
